[project]
name = "bssclient"
description = "Fully typed, async client library for Basic Supply Service (BSS)"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfreuqenz Unternehmensberatung GmbH", email = "info+github@hochfrequenz.de" }]
keywords = ["basic supply", "bss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.0.0",
    "aiohttp>=3.9.3,<3.14",
    "more-itertools",
    "pytz",
    "pyjwt",
    "aioauth_client",
] # add all the dependencies here
dynamic = ["readme", "version"]

[dependency-groups]
tests = [
    "aioresponses==0.7.9",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0"
]
coverage = [
    "coverage==7.15.4",
    {include-group = "tests"}
]
linting = [
    "ruff==0.16.3"
]
spell_check = [
    "codespell==2.4.3"
]
type_check = [
    "mypy[pydantic]==2.3.0",
    "types-pytz==2026.3.1.20260727",
    {include-group = "tests"}
]
dev = [
    {include-group = "tests"},
    {include-group = "coverage"},
    {include-group = "linting"},
    {include-group = "spell_check"},
    {include-group = "type_check"},
    "pre-commit"
]

[tool.uv]
default-groups = []

[project.urls]
Changelog = "https://github.com/Hochfrequenz/bssclient.py/releases"
Homepage = "https://github.com/Hochfrequenz/bssclient.py"

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.field_validator"]

[tool.pytest.ini_options]
# When the mode is auto, all discovered async tests are considered asyncio-driven
# even if they have no @pytest.mark.asyncio marker.
# https://github.com/pytest-dev/pytest-asyncio#auto-mode
asyncio_mode = "auto"

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_bssclient_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
