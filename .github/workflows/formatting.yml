name: "Formatting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  # The "tool" matrix values (black/isort) and the "black (<tool>)" check names are kept unchanged on purpose,
  # even though both now run ruff under the hood - they are required status checks in branch protection, and
  # renaming them would need a coordinated update of that ruleset in the same change. The explicit `name:` below
  # (referencing only `matrix.tool`) keeps the generated check name identical to before, since GitHub Actions
  # would otherwise fold the new `command` matrix key into the auto-generated name too.
  black:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tool: black
            command: "ruff format --check ."
          - tool: isort
            command: "ruff check --select I ."
    name: "black (${{ matrix.tool }})"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --group linting
      - name: ${{ matrix.tool }} Code Formatter
        run: |
          uv run ${{ matrix.command }}
